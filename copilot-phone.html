<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interview Copilot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f6f6f7; --surface: #ffffff; --raised: #f1f1f3; --line: #e2e2e6; --text: #17171a; --dim: #6b6b76;
      --accent: #2456e6; --accent-soft: rgba(36, 86, 230, .09); --ok: #178a4c; --warn: #b86a06; --err: #cc2f2f;
      --ease: cubic-bezier(.2, .7, .2, 1); --base: 220ms; --size: 20px;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e; --surface: #141417; --raised: #1b1b1f; --line: #2a2a30; --text: #ececf0; --dim: #8b8b96;
        --accent: #6c97ff; --accent-soft: rgba(108, 151, 255, .12); --ok: #46d08f; --warn: #f0a63a; --err: #ff7272;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font);
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
    p, ol, ul { margin: 0; padding: 0; list-style: none; }
    button { font: inherit; color: inherit; }

    header {
      position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .dot { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--err); flex: none; transition: background var(--base) var(--ease); }
    .dot.on { background: var(--ok); }
    .dot.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--ok); animation: ring 2.4s var(--ease) infinite; }
    .dot.wait { background: var(--warn); animation: breathe 1.6s ease-in-out infinite; }
    #state { flex: 1; color: var(--dim); font-size: 13px; }
    .size button { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--dim);
      transition: color .16s var(--ease), border-color .16s var(--ease), transform 90ms var(--ease); }
    .size button:active { transform: scale(.94); color: var(--text); border-color: var(--dim); }

    main { padding: 4px 16px calc(env(safe-area-inset-bottom) + 24px); }
    .empty { margin-top: 28vh; text-align: center; color: var(--dim); padding: 0 24px; animation: fade var(--base) var(--ease) both; }

    .card { margin-top: 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; animation: rise var(--base) var(--ease) both; }
    .card.q { border-left: 2px solid var(--accent); }
    .ru { font-size: var(--size); line-height: 1.35; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
    .ru.pending { height: calc(var(--size) * .9); width: 62%; border-radius: 6px;
      background: linear-gradient(90deg, var(--raised) 25%, var(--line) 50%, var(--raised) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    .en { margin-top: 4px; color: var(--dim); font-size: calc(var(--size) * .62); }
    .keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .keys li { padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: calc(var(--size) * .62); font-weight: 550; animation: fade var(--base) var(--ease) both; }
    .answers { display: grid; gap: 6px; margin-top: 10px; }
    .answers li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
      font-size: calc(var(--size) * .85); animation: rise var(--base) var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
    .answers .n { color: var(--dim); font-family: var(--mono); font-size: calc(var(--size) * .6); line-height: 2; }
    .meta { margin-top: 8px; color: var(--dim); font-size: 12px; font-family: var(--mono); }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes ring { 0% { opacity: .55; transform: scale(.7); } 70%, 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header>
    <span class="dot wait" id="dot"></span>
    <span id="state">Connecting…</span>
    <span class="size">
      <button id="smaller" aria-label="Smaller text">A−</button>
      <button id="bigger" aria-label="Bigger text">A+</button>
    </span>
  </header>
  <main id="feed">
    <p class="empty" id="empty">Waiting for the interview.<br>Set Auto-Lock to Never in Settings → Display &amp; Brightness while using this screen.</p>
  </main>

  <script>
    var params = new URLSearchParams(location.search);
    var token = params.get('t') || sessionStorage.getItem('copilot-token') || '';
    try { if (params.get('t')) sessionStorage.setItem('copilot-token', token); } catch (e) {}
    if (params.get('t')) history.replaceState(null, '', location.pathname); // keep the token out of the address bar

    var feed = document.getElementById('feed');
    var cards = new Map(); // id -> { card, ru, en, keys, answers, meta }
    var order = [];        // ids, oldest first

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    // Nodes are reused while a card streams in, so entry animations play once per element.
    function upsert(c) {
      var empty = document.getElementById('empty');
      if (empty) empty.remove();
      var n = cards.get(c.id);
      if (!n) {
        n = { card: el('article', 'card'), ru: el('p', 'ru pending'), en: el('p', 'en'),
              keys: el('ul', 'keys'), answers: el('ol', 'answers'), meta: el('p', 'meta') };
        n.card.append(n.ru, n.en, n.keys, n.answers, n.meta);
        cards.set(c.id, n);
        order.push(c.id);
        feed.prepend(n.card); // newest on top: easiest to glance at
      }
      n.card.classList.toggle('q', !!c.isQ);
      if (n.en.textContent !== c.en) n.en.textContent = c.en;
      if (c.ru) { n.ru.classList.remove('pending'); if (n.ru.textContent !== c.ru) n.ru.textContent = c.ru; }
      else if (c.meta) n.ru.classList.remove('pending');
      (c.keys || []).forEach(function (k, i) {
        var li = n.keys.children[i];
        if (!li) { li = el('li'); n.keys.append(li); }
        if (li.textContent !== k) li.textContent = k;
      });
      while (n.keys.children.length > (c.keys || []).length) n.keys.lastChild.remove();
      (c.answers || []).forEach(function (a, i) {
        var li = n.answers.children[i];
        if (!li) {
          li = el('li'); li.style.setProperty('--i', i);
          li.append(el('span', 'n', String(i + 1)), el('span', 't'));
          n.answers.append(li);
        }
        var t = li.querySelector('.t');
        if (t.textContent !== a) t.textContent = a;
      });
      if (n.meta.textContent !== (c.meta || '')) n.meta.textContent = c.meta || '';
    }

    function clearAll() {
      cards.forEach(function (n) { n.card.remove(); });
      cards.clear();
      order = [];
    }

    var dot = document.getElementById('dot');
    var state = document.getElementById('state');
    var retry = 1000;

    function connect() {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var ws = new WebSocket(proto + '//' + location.host + '/ws?role=sub&t=' + encodeURIComponent(token));
      ws.onopen = function () { dot.className = 'dot on'; state.textContent = 'Live'; retry = 1000; };
      ws.onmessage = function (e) {
        var m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.type === 'snapshot') { clearAll(); m.cards.forEach(upsert); }
        else if (m.type === 'card') upsert(m.card);
        else if (m.type === 'clear') clearAll();
      };
      ws.onclose = function (e) {
        if (e.code === 1008) { dot.className = 'dot'; state.textContent = 'Wrong or missing token. Open the link printed by "npm run phone".'; return; }
        dot.className = 'dot wait';
        state.textContent = 'Reconnecting…';
        setTimeout(connect, retry);
        retry = Math.min(retry * 2, 8000);
      };
    }
    connect();

    var size = Number(localStorage.getItem('copilot-size')) || 20;
    function applySize() { document.documentElement.style.setProperty('--size', size + 'px'); try { localStorage.setItem('copilot-size', size); } catch (e) {} }
    document.getElementById('smaller').onclick = function () { size = Math.max(14, size - 2); applySize(); };
    document.getElementById('bigger').onclick = function () { size = Math.min(40, size + 2); applySize(); };
    applySize();
  </script>
</body>
</html>
