name: Deploy site to GitHub Pages

# Site layout:  /          Interview Copilot (built from extension/)
#               /classic/  the original teleprompter (static files from the repo root)
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [develop, master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # .nvmrc still says 12, which Vite cannot run on
          cache: npm

      # onnxruntime-node's postinstall downloads native binaries that the browser build does not need
      - run: npm ci --ignore-scripts

      - run: npm test

      - run: npm run build:interview

      - name: Assemble site
        run: |
          mkdir -p _site/classic
          cp -r dist/interview-web/. _site/
          cp -r index.html remote.html manifest.json sw.js favicon.ico assets _site/classic/
          cp robots.txt humans.txt sitemap.xml favicon.ico _site/
          # a replacement for the old root service worker, so returning visitors do not keep seeing the classic app
          cp .github/pages/sw.js _site/sw.js
          sed -i 's#https://legenki.github.io/teleprompter/"#https://legenki.github.io/teleprompter/classic/"#' _site/classic/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
